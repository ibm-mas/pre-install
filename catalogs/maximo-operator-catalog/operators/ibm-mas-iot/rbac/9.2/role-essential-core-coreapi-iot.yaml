---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:iot
  namespace: mas-{{ mas_instance_id }}-iot
rules:

  # Essential permissions for MAS binding functionality
  # These are required for CoreAPI to manage binding secrets and configmaps in application namespaces
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - update
      - create
      - delete
      - patch

  # Ability to get IoT CRs for configuration retrieval
  - apiGroups:
      - iot.ibm.com
    resources:
      - iots
      - iotworkspaces
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:iot
  namespace: mas-{{ mas_instance_id }}-iot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:iot
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core
