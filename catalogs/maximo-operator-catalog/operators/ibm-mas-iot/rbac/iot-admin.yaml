---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iot-admin
  namespace: ""
rules:
  - apiGroups:
      - iot.ibm.com/v1
    resources:
      - iots
      - iotworkspaces
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
