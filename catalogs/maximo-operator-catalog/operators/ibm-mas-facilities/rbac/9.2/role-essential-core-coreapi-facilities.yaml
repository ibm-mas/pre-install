---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:facilities
  namespace: mas-{{ mas_instance_id }}-facilities
rules:

  # Essential permissions for MAS binding functionality
  # These are required for CoreAPI to manage binding secrets and configmaps in application namespaces
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - update
      - create
      - delete
      - patch

  # Ability to get, create, and modify the MAS application in this namespace
  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - facilitiesworkspaces
    verbs:
      - get
      - create
      - patch
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:facilities
  namespace: mas-{{ mas_instance_id }}-facilities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:facilities
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core