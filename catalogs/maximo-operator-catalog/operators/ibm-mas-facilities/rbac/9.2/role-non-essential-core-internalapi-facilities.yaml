---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:facilities
  namespace: mas-{{ mas_instance_id }}-facilities
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - get
  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - facilitiesapps
      - facilitiesworkspaces
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:facilities
  namespace: mas-{{ mas_instance_id }}-facilities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:internalapi:facilities
subjects:
  - kind: ServiceAccount
    name: ibm-mas-internalapi
    namespace: mas-{{ mas_instance_id }}-core
