---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db2u-admin
  namespace: ""
rules:
  - apiGroups:
      - db2u.databases.ibm.com/v1
    resources:
      - db2uclusters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
