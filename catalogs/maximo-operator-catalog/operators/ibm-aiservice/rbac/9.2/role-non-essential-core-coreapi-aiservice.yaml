---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:aiservice
  namespace: mas-{{ mas_instance_id }}-aiservice
rules:

  - apiGroups:
      - project.openshift.io
    resources:
      - projects
    verbs:
      - get

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get

  # Ability to install an operator in the namespace
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
      - operatorgroups
      - subscriptions
    verbs:
      - get
      - list
      - create
      - patch


---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:aiservice
  namespace: mas-{{ mas_instance_id }}-aiservice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:aiservice
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core
