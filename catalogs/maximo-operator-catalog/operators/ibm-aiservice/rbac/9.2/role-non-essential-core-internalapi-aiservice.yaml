---
apiVersion: v1
kind: Namespace
metadata:
  name: mas-{{ mas_instance_id }}-aiservice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:aiservice
  namespace: mas-{{ mas_instance_id }}-aiservice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:internalapi:aiservice
subjects:
  - kind: ServiceAccount
    name: ibm-mas-internalapi
    namespace: mas-{{ mas_instance_id }}-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:aiservice
  namespace: mas-{{ mas_instance_id }}-aiservice
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get

  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - get

  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - aiserviceapps
      - aiserviceworkspaces
    verbs:
      - get
