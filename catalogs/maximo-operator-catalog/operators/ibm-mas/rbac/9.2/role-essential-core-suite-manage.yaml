---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:suite:manage
  namespace: mas-{{ mas_instance_id }}-core
rules:
  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - suites
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:suite:manage
  namespace: mas-{{ mas_instance_id }}-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:suite:manage
subjects:
  - kind: ServiceAccount
    name: ibm-mas-manage-operator
    namespace: mas-{{ mas_instance_id }}-manage
