---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:monitor
  namespace: mas-{{ mas_instance_id }}-monitor
rules:
  - apiGroups:
      - project.openshift.io
    resources:
      - projects
    verbs:
      - create
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
  # Ability to install an operator in the namespace
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
      - operatorgroups
      - subscriptions
    verbs:
      - get
      - list
      - create
      - patch
  # Ability to get, create, and modify the MAS application in this namespace
  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - monitorapps
      - monitorworkspaces
    verbs:
      - get
      - create
      - patch
  # Application lifecycle management: Secrets and ConfigMaps
  # Required for managing application configurations, workspace secrets, TLS certificates, and app-specific configs
  - apiGroups:
      - ''
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:monitor
  namespace: mas-{{ mas_instance_id }}-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:monitor
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core
