---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:monitor
  namespace: mas-{{ mas_instance_id }}-monitor
rules:

  # Essential permissions for MAS binding functionality
  # These are required for CoreAPI to manage binding secrets and configmaps in application namespaces
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - update
      - create
      - delete
      - patch

  # Ability to get, create, and modify the MAS application in this namespace
  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - monitorworkspaces
    verbs:
      - get
      - create
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:monitor
  namespace: mas-{{ mas_instance_id }}-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:monitor
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core