---
kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
namespace: mas-dev1-sls
resources:
  - ../../../maximo-operator-catalog/v9-251127-amd64/ibm-sls
  - ../../../maximo-operator-catalog/v9-251127-amd64/ibm-truststore-mgr
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: mas-dev1-sls

  - target:
      kind: OperatorGroup
      name: ibm-sls-operator-group
    patch: |-
      - op: replace
        path: /spec/targetNamespaces
        value:
          - mas-dev1-sls
