apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../operators/ibm-mas-facilities
patches:
  - target:
      kind: Subscription
      name: ibm-mas-facilities
    patch: |-
      - op: replace
        path": /spec/channel
        value: 9.1.x
      - op: replace
        path: /spec/startingCSV
        value: ibm-mas-facilities.v9.1.6
