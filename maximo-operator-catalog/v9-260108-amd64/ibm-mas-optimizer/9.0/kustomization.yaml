apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../operators/ibm-mas-optimizer
patches:
  - target:
      kind: Subscription
      name: ibm-mas-optimizer
    patch: |-
      - op: replace
        path": /spec/channel
        value: 9.0.x
      - op: replace
        path: /spec/startingCSV
        value: ibm-mas-optimizer.v9.0.16-amd64
