apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../operators/ibm-mas-manage
patches:
  - target:
      kind: Subscription
      name: ibm-mas-manage
    patch: |-
      - op: replace
        path": /spec/channel
        value: 9.0.x
      - op: replace
        path: /spec/startingCSV
        value: ibm-mas-manage.v9.0.18-s390x
