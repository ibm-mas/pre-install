apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../operators/ibm-mas
patches:
  - target:
      kind: Subscription
      name: ibm-mas
    patch: |-
      - op: replace
        path": /spec/channel
        value: 9.1.x
      - op: replace
        path: /spec/startingCSV
        value: ibm-mas.v9.1.5-s390x
