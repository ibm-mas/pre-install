---
apiVersion: v1
kind: Namespace
metadata:
  name: mas-{{ mas_instance_id }}-iot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:iot:entitymgr-primary-entity:cert-manager
  namespace: cert-manager
rules:
  - apiGroups:
      - cert-manager.io
    resources:
      - issuers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:iot:entitymgr-primary-entity:cert-manager
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:iot:entitymgr-primary-entity:cert-manager
subjects:
  - kind: ServiceAccount
    name: ibm-mas-iot-entitymgr-primary-entity
    namespace: mas-{{ mas_instance_id }}-iot
