---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: facilities-admin
  namespace: ""
rules:
  - apiGroups:
      - apps.mas.ibm.com/v1
    resources:
      - facilitiesapps
      - facilitiesworkspaces
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
