---
# Non-Essential Namespace-Scoped Role for CoreAPI in cert-manager namespace
# Allow CoreAPI to read certificate secrets for internal CA certificate generation

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:cert-manager
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:cert-manager
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:cert-manager
  namespace: cert-manager
rules:
  # Used by coreapi to Retrieve {instanceId}-cert-internal-ca secret to generate certificates for internal services
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - patch
