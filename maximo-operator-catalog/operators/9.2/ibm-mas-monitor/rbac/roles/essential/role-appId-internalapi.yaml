---
apiVersion: v1
kind: Namespace
metadata:
  name: mas-{{ mas_instance_id }}-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:monitor
  namespace: mas-{{ mas_instance_id }}-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:internalapi:monitor
subjects:
  - kind: ServiceAccount
    name: ibm-mas-internalapi
    namespace: mas-{{ mas_instance_id }}-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:monitor
  namespace: mas-{{ mas_instance_id }}-monitor
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - delete

  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - delete
