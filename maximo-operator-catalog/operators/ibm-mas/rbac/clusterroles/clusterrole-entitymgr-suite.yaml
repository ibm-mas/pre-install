---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:entitymgr-suite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mas:{{ mas_instance_id }}:core:entitymgr-suite
subjects:
  - kind: ServiceAccount
    name: ibm-mas-entitymgr-suite
    namespace: mas-{{ mas_instance_id }}-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mas:{{ mas_instance_id }}:core:entitymgr-suite
rules:
  # Why do we need global access to all secrets in a cluster?
  # - We don't, this needs to be fixed
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - patch

  # ClusterIssuers are cluster-scoped, unavoidable
  - apiGroups:
      - cert-manager.io
    resources:
      - clusterissuers
    verbs:
      - get
      - watch
      - list
      - create
      - update
      - patch
      - delete

