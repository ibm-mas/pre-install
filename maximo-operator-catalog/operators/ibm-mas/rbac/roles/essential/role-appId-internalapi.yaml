---
apiVersion: v1
kind: Namespace
metadata:
  name: mas-{{ mas_instance_id }}-{{ mas_app_id }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:{{ mas_app_id }}
  namespace: mas-{{ mas_instance_id }}-{{ mas_app_id }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:internalapi:{{ mas_app_id }}
subjects:
  - kind: ServiceAccount
    name: ibm-mas-internalapi
    namespace: mas-{{ mas_instance_id }}-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:internalapi:{{ mas_app_id }}
  namespace: mas-{{ mas_instance_id }}-{{ mas_app_id }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - delete

  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - delete

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get

  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - get

  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - {{ mas_app_id }}apps
      - {{ mas_app_id }}workspaces
    verbs:
      - get
