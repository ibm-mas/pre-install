---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:{{ app_id }}:{{ entitymgr_name }}:cert-manager
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:{{ app_id }}:{{ entitymgr_name }}:cert-manager
subjects:
  - kind: ServiceAccount
    name: {{ service_account_name }}
    namespace: mas-{{ mas_instance_id }}-{{ app_id }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:{{ app_id }}:{{ entitymgr_name }}:cert-manager
  namespace: cert-manager
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - patch
      - delete

  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - issuers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
