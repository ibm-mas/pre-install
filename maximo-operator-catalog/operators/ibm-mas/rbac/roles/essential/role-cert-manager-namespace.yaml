---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:certs:{{ service_account_name }}
  namespace: {{ target_namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:certs:{{ service_account_name }}
subjects:
  - kind: ServiceAccount
    name: {{ service_account_name }}
    namespace: {{ service_account_namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:certs:{{ service_account_name }}
  namespace: {{ target_namespace }}
rules:
  # Certificates are namespace-scoped resources
  # Allows MAS to create and manage certificates for internal and public communication
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - get
      - watch
      - list
      - create
      - update
      - patch
      - delete

  # Issuers are namespace-scoped resources
  # Allows MAS to create and manage issuers (internal-issuer, public-issuer)
  - apiGroups:
      - cert-manager.io
    resources:
      - issuers
    verbs:
      - get
      - watch
      - list
      - create
      - update
      - patch
      - delete
