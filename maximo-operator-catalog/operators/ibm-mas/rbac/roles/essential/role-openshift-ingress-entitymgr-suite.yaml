---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:entitymgr-suite:ingress
  namespace: openshift-ingress-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:entitymgr-suite:ingress
subjects:
  - kind: ServiceAccount
    name: ibm-mas-entitymgr-suite
    namespace: mas-{{ mas_instance_id }}-core

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:entitymgr-suite:ingress
  namespace: openshift-ingress-operator
rules:
  # IngressController access for path-based routing configuration
  # Required to validate and patch routeAdmission policy for inter-namespace route sharing
  - apiGroups:
      - operator.openshift.io
    resources:
      - ingresscontrollers
    verbs:
      - get
      - list
      - watch
      - patch
      - update
