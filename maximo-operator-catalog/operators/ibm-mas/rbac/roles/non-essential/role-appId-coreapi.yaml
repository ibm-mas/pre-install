---
apiVersion: v1
kind: Namespace
metadata:
  name: mas-{{ mas_instance_id }}-{{ mas_app_id }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:{{ mas_app_id }}
  namespace: mas-{{ mas_instance_id }}-{{ mas_app_id }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:{{ mas_app_id }}
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:{{ mas_app_id }}
  namespace: mas-{{ mas_instance_id }}-{{ mas_app_id }}
rules:
  - apiGroups:
      - project.openshift.io
    resources:
      - projects
    verbs:
      - create
      - get

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get

  # Ability to install an operator in the namespace
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
      - operatorgroups
      - subscriptions
    verbs:
      - get
      - list
      - create
      - patch

  # Ability to get, create, and modify the MAS application in this namespace
  - apiGroups:
      - apps.mas.ibm.com
    resources:
      - {{ mas_app_id }}apps
      - {{ mas_app_id }}workspaces
    verbs:
      - get
      - create
      - patch
