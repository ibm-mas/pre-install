---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:openshift-marketplace
  namespace: openshift-marketplace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas:{{ mas_instance_id }}:core:coreapi:openshift-marketplace
subjects:
  - kind: ServiceAccount
    name: ibm-mas-coreapi
    namespace: mas-{{ mas_instance_id }}-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas:{{ mas_instance_id }}:core:coreapi:openshift-marketplace
  namespace: openshift-marketplace
rules:
  # Used by coreapi to Get available operator versions and catalog information for applications
  - apiGroups:
      - packages.operators.coreos.com
    resources:
      - packagemanifests
    verbs:
      - get
  # Used by coreapi to Validate and retrieve CatalogSource information for operator subscriptions during application lifecycle management
  - apiGroups:
      - operators.coreos.com
    resources:
      - catalogsources
    verbs:
      - get
