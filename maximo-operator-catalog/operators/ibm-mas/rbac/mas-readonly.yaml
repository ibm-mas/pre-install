---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas-readonly
  namespace: ""
rules:
  - apiGroups:
      - core.mas.ibm.com
    resources:
      - suites
      - workspaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - config.mas.ibm.com
    resources:
      - appcfgs
      - bascfgs
      - idpcfgs
      - jdbccfgs
      - kafkacfgs
      - mongocfgs
      - objectstoragecfgs
      - pushnotificationcfgs
      - scimcfgs
      - slscfgs
      - smtpcfgs
      - watsonstudiocfgs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - addons.mas.ibm.com
    resources:
      - genericaddons
      - mviedges
      - replicadbs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - internal.mas.ibm.com
    resources:
      - coreidp
    verbs:
      - get
      - list
      - watch
